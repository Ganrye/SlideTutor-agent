  <text x="112" y="214" font-size="28" font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#42526a">核心问题：如何描述一个量变化得有多快？</text>
  <rect x="118" y="260" width="430" height="74" rx="10" fill="#eef6ff" stroke="#4c8eda" stroke-width="2"/>
  <text x="146" y="308" font-size="34" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700" fill="#1f5f99">平均变化率 = Δy / Δx</text>
  <text x="118" y="394" font-size="25" font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#536273">从两个点之间的整体变化开始。</text>
  <rect x="720" y="184" width="420" height="320" rx="12" fill="#f5f7fb" stroke="#ccd7e6"/>
  <path d="M750 450 C820 370, 875 380, 930 300 S1050 185, 1110 238" fill="none" stroke="#1f6feb" stroke-width="7"/>
  <line x1="800" y1="390" x2="1065" y2="245" stroke="#d25b5b" stroke-width="5"/>
  <circle cx="800" cy="390" r="10" fill="#d25b5b"/>
  <circle cx="1065" cy="245" r="10" fill="#d25b5b"/>
  <text x="812" y="536" font-size="25" font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#536273">两点割线的斜率</text>
