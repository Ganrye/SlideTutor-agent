<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="58" y="42" width="1164" height="636" rx="18" fill="#ffffff" stroke="#d8e1ec"/>
  <text x="86" y="122" font-size="52" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700" fill="#1c2430">导数：瞬时变化率</text>
  <text x="104" y="205" font-size="28" font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#42526a">当间隔趋近于 0，平均变化率变成瞬时变化率。</text>
  <rect x="90" y="244" width="760" height="96" rx="10" fill="#edf9f0" stroke="#54ae6f" stroke-width="2"/>
  <text x="124" y="305" font-size="36" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700" fill="#247443">f'(x) = lim h→0 [f(x+h)-f(x)] / h</text>
  <rect x="116" y="410" width="640" height="70" rx="10" fill="#f2f4f8" stroke="#ccd7e6"/>
  <text x="148" y="455" font-size="30" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700" fill="#334155">导数就是曲线在某一点的切线斜率</text>
  <rect x="870" y="236" width="260" height="260" rx="130" fill="#eef6ff" stroke="#bfd7f7"/>
  <line x1="916" y1="410" x2="1085" y2="276" stroke="#d25b5b" stroke-width="7"/>
  <path d="M905 432 C970 350, 1022 340, 1088 288" fill="none" stroke="#1f6feb" stroke-width="7"/>
  <text x="910" y="548" font-size="25" font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#536273">一点处的切线斜率</text>
</svg>

